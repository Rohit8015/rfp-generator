# Streamlit's analytics endpoint is unreachable in this environment and logs a recurring
# "pageProfile TypeError: Failed to fetch" in the browser console. Nothing to do with the
# app, but it is noise during a demo with the console open.
[browser]
gatherUsageStats = false

[server]
headless = true

[client]
# Hide the developer menu items (including "View app source" and the GitHub link) from
# viewers of the deployed app. "minimal" shows only essential controls.
toolbarMode = "minimal"

[theme]
base = "light"
# Accent colour for buttons, sliders, the progress bar and highlights. Streamlit's
# default is a red/coral (#FF4B4B); this sets the theme to purple. Cosmetic only.
primaryColor = "#7C3AED"

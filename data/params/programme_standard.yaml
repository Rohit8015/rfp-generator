programme: standard_transformation
duration_months: 30
description: "Standard digital transformation (₹35-50 Cr, 45 FTE peak)"

phases:
  - name: Discovery
    weeks: 8
    fte: 20
    description: "Comprehensive current state assessment, requirements validation"
  - name: Design
    weeks: 12
    fte: 25
    description: "Solution architecture, detailed design, integration strategy"
  - name: Build_Phase1
    weeks: 16
    fte: 40
    description: "Sprint 1-3: Core platform development"
  - name: Build_Phase2
    weeks: 12
    fte: 45
    description: "Sprint 4-6: Advanced features and integration"
  - name: Pilot
    weeks: 8
    fte: 35
    description: "Pilot deployment, UAT, optimization"
  - name: Rollout
    weeks: 12
    fte: 30
    description: "Phased rollout across all locations"
  - name: Stabilize
    weeks: 4
    fte: 15
    description: "Hyper-care, final transition"

total_weeks: 72
peak_fte: 45
average_fte: 30

cost_parameters:
  blended_day_rate_eur: 950
  blended_day_rate_inr: 85000
  software_subscription_eur: 2400000
  software_subscription_inr: 216000000
  cloud_eur: 1800000
  cloud_inr: 162000000
  contingency_pct: 10
  additional_training_eur: 1000000
  additional_training_inr: 90000000
  program_management_eur: 1500000
  program_management_inr: 135000000

deliverables:
  - "Enterprise architecture blueprint"
  - "Detailed solution design"
  - "Working software (5 releases)"
  - "Integration framework"
  - "Data migration plan and execution"
  - "Comprehensive test suite"
  - "Training program and materials"
  - "Go-live runbook"
  - "Production support handover"
  - "Project closure report"

milestones:
  - name: "M1 - Discovery Complete"
    week: 8
    deliverable: "Current state + requirements"
    payment_pct: 10
  - name: "M2 - Design Complete"
    week: 20
    deliverable: "Solution architecture"
    payment_pct: 15
  - name: "M3 - Core Platform Ready"
    week: 36
    deliverable: "MVP demonstration"
    payment_pct: 20
  - name: "M4 - Integration Complete"
    week: 48
    deliverable: "All integrations tested"
    payment_pct: 20
  - name: "M5 - Pilot Live"
    week: 56
    deliverable: "Pilot go-live"
    payment_pct: 15
  - name: "M6 - Full Rollout"
    week: 68
    deliverable: "Full go-live"
    payment_pct: 15
  - name: "M7 - Project Closure"
    week: 72
    deliverable: "Handover and closure"
    payment_pct: 5

assumptions:
  - "Client provides timely approvals (5-day SLA)"
  - "Client IT resources available for integration"
  - "Client data quality meets threshold"
  - "Regulatory environment remains stable"